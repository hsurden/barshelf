name: BarShelf
options:
  bundleIdPrefix: com.hsurden
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
targets:
  BarShelf:
    type: application
    platform: macOS
    sources:
      - path: Sources/BarShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsurden.barshelf
        PRODUCT_NAME: BarShelf
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/BarShelf/Info.plist
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_STRICT_CONCURRENCY: complete
    entitlements:
      path: Sources/BarShelf/BarShelf.entitlements
      properties:
        com.apple.security.app-sandbox: false
  BarShelfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BarShelfTests
    dependencies:
      - target: BarShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hsurden.barshelf.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BarShelf:
    build:
      targets:
        BarShelf: all
        BarShelfTests: [test]
    test:
      targets:
        - BarShelfTests
