name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Run tests
        run: xcodebuild -quiet -project BarShelf.xcodeproj -scheme BarShelf -configuration Debug -derivedDataPath .xcode-build CODE_SIGNING_ALLOWED=NO test

      - name: Build app bundle
        env:
          SIGN_IDENTITY: "-"
        run: ./scripts/build-app.sh

      # This fork removed Sparkle so an upstream update can never replace it.
      - name: Verify app has no upstream updater
        run: |
          app=dist/BarShelf.app
          codesign --verify --deep --strict --verbose=1 "$app"
          if [ -e "$app/Contents/Frameworks/Sparkle.framework" ]; then
            echo "::error::Sparkle.framework is bundled"
            exit 1
          fi
          for key in SUFeedURL SUPublicEDKey; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$app/Contents/Info.plist" >/dev/null 2>&1; then
              echo "::error::Info.plist contains the update key $key"
              exit 1
            fi
          done
          if otool -L "$app/Contents/MacOS/BarShelf" | grep -qi sparkle; then
            echo "::error::The executable links Sparkle"
            exit 1
          fi

      - name: Verify launch
        run: |
          dist/BarShelf.app/Contents/MacOS/BarShelf & PID=$!
          sleep 5
          if kill -0 $PID 2>/dev/null; then
            kill $PID
          else
            echo "::error::BarShelf exited during launch"
            exit 1
          fi
